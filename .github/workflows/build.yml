name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run fetch:cli
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Desktop startup on Windows
        timeout-minutes: 2
        if: runner.os == 'Windows'
        run: npm start -- --smoke-test
      - name: Desktop startup on Linux
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: xvfb-run -a npm start -- --smoke-test
      - name: Build native distribution
        run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Source archive
        if: runner.os == 'Linux'
        run: npm run source
      - name: Checksums
        run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wasl-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
            release/SHA256SUMS-*.txt
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --draft --title "Wasl $RELEASE_TAG — وصل" --notes-file docs/RELEASE_NOTES.md
